# 打安装包并挂到 GitHub Release。日常 push 不跑 —— CEF 太重，不该挡 UI 改动。
#
# 触发：
#   - 推 tag `Riot_0.1.0`（版本号对齐 src-tauri/tauri.conf.json）
#   - Actions 里手动跑 Release（先出 draft，核对资产再发布）
#
# GitHub 不按 tag 去重 draft，`releases/tags/{tag}` 也查不到草稿。
# macOS / Windows 若各自调 tauri-action 建 Release，会拆成两份、资产各挂一边。
# 所以先单独建（或复用）一份，matrix 只按 releaseId 上传。
#
# 官网下载地址按这个 tag 约定写：
#   Riot_<ver>/Riot_<ver>_aarch64.dmg
#   Riot_<ver>/Riot_<ver>_x64-setup.exe
#
# Linux 服务器版不进 Release 资产，出 Docker 镜像推到 GHCR：
#   ghcr.io/<owner>/riot-server:<ver>        多架构，pull 时自动选
#   ghcr.io/<owner>/riot-server:<ver>-amd64 / <ver>-arm64
#   ghcr.io/<owner>/riot-server:latest       只在推 tag 正式发版时更新
# GHCR 上的包第一次推上去默认是私有的，要公开得去包设置里改一次。
#
# 未配置 Apple 证书时 macOS 仍能打出 dmg，只是没签名，别人要右键打开。
# 需要公证时在仓库 Secrets 里加 APPLE_CERTIFICATE（p12 的 base64）、
# APPLE_CERTIFICATE_PASSWORD、APPLE_ID、APPLE_PASSWORD、APPLE_TEAM_ID。
name: Release

on:
  push:
    tags:
      - "Riot_*"
      - "v*"
  workflow_dispatch:

# `[约束]` 全仓库一个组，不按 ref 分。create-release 的「查有没有草稿 →
# 没有就建」不是原子的：推 tag（ref 是 refs/tags/…）和手动跑（refs/heads/master）
# 按 ref 分组时会同时跑，两边都查到没有、各建一份，资产又拆到两个 Release
# 里。同一版本同时推 `Riot_*` 和 `v*` 两个 tag 也是这样。排队跑，后一次
# 就会复用前一次建的那份。
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # 浏览器脚本和 cef-dll-sys 都认这个。放 workspace 里方便 cache。
  CEF_PATH: ${{ github.workspace }}/.cef

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.ensure.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
      - id: ensure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          version=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          tag="Riot_${version}"
          name="Riot ${version}"
          body="$(printf '%s\n' \
            'macOS：`Riot_*_aarch64.dmg`（Apple Silicon）' \
            'Windows：`Riot_*_x64-setup.exe`' \
            "Linux 服务器（无界面，网页访问）：\`docker pull ghcr.io/${IMAGE_OWNER,,}/riot-server:${version}\`（x86_64 / arm64）")"

          # 草稿必须扫列表。同一 tag 若已经拆成多份，拿资产最多的那份。
          # 用 awk 收齐，不用 head：pipefail 下提前关管道会 SIGPIPE。
          id=$(gh api --paginate "repos/${{ github.repository }}/releases" \
            --jq ".[] | select(.tag_name == \"$tag\") | \"\(.id)\t\(.assets | length)\"" \
            | awk -F'\t' '$2+0 > max+0 { max=$2; id=$1 } END { if (id != "") print id }')

          if [[ -z "${id}" ]]; then
            id=$(gh api "repos/${{ github.repository }}/releases" \
              -f tag_name="$tag" \
              -f name="$name" \
              -f body="$body" \
              -f target_commitish="${{ github.sha }}" \
              -F draft=true \
              -F generate_release_notes=true \
              --jq .id)
            echo "已建 draft $tag id=$id"
          else
            echo "复用已有 Release $tag id=$id"
          fi
          echo "release_id=${id}" >> "$GITHUB_OUTPUT"

  bundle:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 10 }

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # 浏览器是独立 workspace，不写进来的话 CEF 绑定每次重编。
          workspaces: |
            . -> target
            crates/riot-browser -> crates/riot-browser/target

      - name: 缓存 CEF 二进制
        uses: actions/cache@v4
        with:
          path: ${{ env.CEF_PATH }}
          key: cef-${{ runner.os }}-${{ runner.arch }}-151.3

      - name: 缓存 CEF 相关 cargo bin
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/export-cef-dir
            ~/.cargo/bin/export-cef-dir.exe
            ~/.cargo/bin/bundle-cef-app
          key: cef-bins-${{ runner.os }}-151.3

      - name: Windows 打开长路径 / MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Git Bash 的 usr\bin 里也有 link.exe。只要这一节还在 PATH 前面，cargo
      # 就会拿 GNU link 去链 MSVC 目标，报 extra operand。从 job PATH 里拿掉，
      # 后面的 pwsh / tauri-action 才用得上刚开的 MSVC。
      - name: 拿掉 Git 的 link.exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $drop = @('Git\usr\bin', 'Git\bin', 'Git\mingw64\bin')
          $keep = ($env:PATH -split ';' | Where-Object {
            $p = $_
            -not ($drop | Where-Object { $p -like "*$_*" })
          }) -join ';'
          $env:PATH = $keep
          Add-Content -Path $env:GITHUB_ENV -Value "PATH=$keep"
          $link = (Get-Command link.exe -ErrorAction SilentlyContinue).Source
          Write-Host "link.exe = $link"
          if (-not $link -or $link -match '(?i)[\\/]Git[\\/]') {
            throw "PATH 里还是 Git 的 link.exe，cargo 编不过"
          }

      - name: 拉取 CEF
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d "$CEF_PATH/Chromium Embedded Framework.framework" ]]; then
            echo "CEF 缓存命中: $CEF_PATH"
            exit 0
          fi
          if ! command -v export-cef-dir >/dev/null 2>&1; then
            # 版本必须停在 151.3 这一线，和 crates/riot-browser 的 cef crate 对齐。
            cargo install export-cef-dir --locked --version "151.6.0+151.3.18"
          fi
          export-cef-dir --force "$CEF_PATH"

      - name: 打包内置浏览器
        if: runner.os != 'Windows'
        run: ./scripts/build-browser.sh

      # 必须 pwsh：同一条 bash 里再调 powershell，子进程仍继承 Git Bash 的 PATH。
      - name: 打包内置浏览器
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $link = (Get-Command link.exe).Source
          Write-Host "link.exe = $link"
          if ($link -match '(?i)[\\/]Git[\\/]') {
            throw "PATH 里还是 Git 的 link.exe，cargo 编不过"
          }
          scripts/build-browser.ps1

      - run: pnpm install --frozen-lockfile

      # GitHub 没配 secret 时仍会把空字符串写进环境变量。tauri 只要看见
      # APPLE_CERTIFICATE 就去 security import，空数据报
      # `SecKeychainItemImport: parameters not valid`，包已经编出来了也打不成。
      # 有内容才交给下一步；没配就走未签名 dmg（别人要右键打开）。
      - name: 有证书才打开签名
        if: runner.os == 'macOS'
        shell: bash
        env:
          _CERT: ${{ secrets.APPLE_CERTIFICATE }}
          _CERT_PW: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          _SIGN_ID: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          _APPLE_ID: ${{ secrets.APPLE_ID }}
          _APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          _APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "$_CERT" ]]; then
            echo "未配置 APPLE_CERTIFICATE，打未签名 dmg"
            exit 0
          fi
          {
            echo "APPLE_CERTIFICATE<<EOF"
            printf '%s\n' "$_CERT"
            echo "EOF"
            echo "APPLE_CERTIFICATE_PASSWORD=$_CERT_PW"
            echo "APPLE_SIGNING_IDENTITY=$_SIGN_ID"
            echo "APPLE_ID=$_APPLE_ID"
            echo "APPLE_PASSWORD=$_APPLE_PASSWORD"
            echo "APPLE_TEAM_ID=$_APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"
          echo "已启用 Apple 签名（证书 ${#_CERT} 字节）"

      # beforeBuildCommand 会再跑 stage-kernel / stage-browser / 前端构建。
      # 浏览器包必须已经在 crates/riot-browser/target/bundle/，否则 stage-browser 直接失败。
      - name: 打安装包并上传 Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # `[约束]` 前端产物在 0.1.8 涨了一截：CodeMirror 的 language-data 给
          # 每种语言一个 chunk，JS chunk 从 133 个变成 250 个，vite build 在
          # rendering chunks 阶段要 ~2.4GB 堆（本机实测峰值 RSS 2.35GB）。
          # macos runner 只有 7GB 内存，Node 按可用内存算出的默认 old-space
          # 上限约 2GB —— 0.1.8 的 macOS 打包就是这么死的（exit 134，
          # FATAL ERROR: Reached heap limit）。给 4GB 留一档余量。
          # Windows runner 16GB，默认上限本就够，写在这里只是让两个平台一致。
          # beforeBuildCommand 里的 `pnpm build` 继承这个变量。
          NODE_OPTIONS: --max-old-space-size=4096
        with:
          # 只上传，不再各自建 Release。
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: Riot___VERSION__
          releaseName: Riot __VERSION__
          # 先建的是 draft；按 tag 复用已有草稿时也必须是 true。
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          uploadWorkflowArtifacts: true
          tauriScript: pnpm tauri
          retryAttempts: 2

  # Linux 无界面版：Docker 镜像（deploy/server/Dockerfile），里面是 riot-server
  # + 内核 + 内置浏览器（CEF）+ 前端产物。两个架构各在原生 runner 上编 ——
  # QEMU 模拟编 CEF 和 Rust 要一个多小时。每个架构推一个带后缀的标签，
  # 再由 server-image-manifest 合成多架构标签。
  server-image:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          set -euo pipefail
          version=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          # GHCR 的镜像名必须小写。
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${owner}/riot-server" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/server/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}-${{ matrix.arch }}
          # 按架构分开缓存：CEF 下载和 Rust release 编译是大头，命中时快很多。
          cache-from: type=gha,scope=riot-server-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=riot-server-${{ matrix.arch }}

  # 两个架构都推上去之后合成多架构标签。`latest` 只在推 tag 正式发版时动 ——
  # 手动跑的是草稿，不该顶掉别人正在 pull 的版本。
  server-image-manifest:
    needs: server-image
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          IMAGE: ${{ needs.server-image.outputs.image }}
          VERSION: ${{ needs.server-image.outputs.version }}
        run: |
          set -euo pipefail
          tags=(-t "${IMAGE}:${VERSION}")
          if [[ "${{ github.event_name }}" != "workflow_dispatch" ]]; then
            tags+=(-t "${IMAGE}:latest")
          fi
          docker buildx imagetools create "${tags[@]}" \
            "${IMAGE}:${VERSION}-amd64" "${IMAGE}:${VERSION}-arm64"
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"

  # 推 tag 两边都挂上再转正。手动跑保持 draft，核对资产后再点发布。
  publish:
    needs: [create-release, bundle, server-image-manifest]
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --method PATCH \
            "repos/${{ github.repository }}/releases/${{ needs.create-release.outputs.release_id }}" \
            -F draft=false
          echo "已发布 release id=${{ needs.create-release.outputs.release_id }}"
